<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" role="img" aria-labelledby="hld-title hld-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="hld-title">Team Markdown docs — high-level design</title>
    <desc id="hld-desc">React single-page app served by Cloudflare Pages, whose edge functions handle GitHub OAuth and proxy Markdown documents from a private GitHub repository, using repository access as the authorization check.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ═══ zones ═══ -->
    <rect x="32" y="72" width="200" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="104" y="76" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="132" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

    <rect x="304" y="72" width="288" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="384" y="76" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="448" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE PAGES</text>

    <rect x="664" y="184" width="264" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="768" y="188" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="796" y="197" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB</text>

    <!-- ═══ arrows (before boxes) ═══ -->
    <!-- browser → static assets -->
    <line x1="208" y1="140" x2="344" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="256" y="120" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="276" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GET /</text>

    <!-- browser → auth functions -->
    <line x1="208" y1="256" x2="344" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="244" y="236" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="276" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">/auth/login</text>

    <!-- browser → api functions -->
    <line x1="208" y1="384" x2="344" y2="384" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="248" y="364" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="276" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/*</text>

    <!-- auth functions → github oauth -->
    <line x1="552" y1="256" x2="704" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="608" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="628" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">OAUTH</text>

    <!-- api functions → content repo -->
    <line x1="552" y1="384" x2="704" y2="384" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="592" y="364" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="628" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONTENTS API</text>

    <!-- auth functions → content repo (repo-access check, dashed) -->
    <path d="M 552,268 H 620 Q 628,268 628,276 V 360 Q 628,368 636,368 H 704"
          fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="636" y="304" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="668" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REPO ACCESS</text>

    <!-- ═══ nodes ═══ -->

    <!-- Browser panel (client) -->
    <rect x="56" y="112" width="152" height="320" rx="6" fill="#f5f5f5"/>
    <rect x="56" y="112" width="152" height="320" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="64" y="120" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
    <text x="86" y="129" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
    <text x="132" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Browser</text>
    <text x="132" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">React SPA</text>
    <text x="132" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">react 18 · vite</text>
    <text x="132" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">react-router v6</text>
    <text x="132" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">react-markdown</text>
    <text x="132" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">remark-gfm · rehype-raw</text>
    <text x="132" y="412" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">session cookie</text>

    <!-- Static assets -->
    <rect x="344" y="112" width="208" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="112" width="208" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="448" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Static Assets</text>
    <text x="448" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dist/ · /* → index.html</text>

    <!-- Auth functions -->
    <rect x="344" y="224" width="208" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="224" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="352" y="232" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="364" y="241" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
    <text x="448" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Auth Functions</text>
    <text x="448" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/auth/* · AES-GCM cookie</text>

    <!-- API functions (focal) -->
    <rect x="344" y="352" width="208" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="352" width="208" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="352" y="360" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="364" y="369" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
    <text x="448" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">API Functions</text>
    <text x="448" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/api/* · fetch docs</text>

    <!-- GitHub OAuth -->
    <rect x="704" y="224" width="184" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="704" y="224" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="712" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="726" y="241" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
    <text x="796" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">GitHub OAuth</text>
    <text x="796" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">identity provider</text>

    <!-- Content repo -->
    <rect x="704" y="344" width="184" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="704" y="344" width="184" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="712" y="352" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="728" y="361" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
    <text x="796" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Content Repo</text>
    <text x="796" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">docs/&lt;topic&gt;/&lt;doc&gt;.md</text>
    <text x="796" y="416" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">private · user token</text>

    <!-- ═══ legend ═══ -->
    <line x1="32" y1="488" x2="928" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="112" y="500" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="130" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">FOCAL</text>

    <rect x="188" y="500" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="206" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">FUNCTION</text>

    <rect x="280" y="500" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="298" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">STORE</text>

    <rect x="356" y="500" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="374" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">EXTERNAL</text>

    <rect x="448" y="500" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="466" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">CLIENT</text>

    <line x1="532" y1="506" x2="556" y2="506" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="564" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">HTTP</text>

    <line x1="616" y1="506" x2="640" y2="506" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="648" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">ACCESS CHECK</text>
  </svg>